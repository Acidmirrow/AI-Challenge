# Единая точка входа для всего курса: один хост и один порт.
#
#   UI:  http://localhost:8500        — общий интерфейс со всеми уроками
#   API: http://localhost:8000        — шлюз: /lesson-01/api/..., /lesson-02/api/...
#
# Код каждого урока остаётся в своей папке (Lesson 0X/app) — здесь только сборка
# четырёх API, шлюза и одного фронта. Отдельные `Lesson 0X/app/docker-compose.yml`
# по-прежнему годятся для работы над одним уроком в изоляции.

name: ai-challenge

services:
  lesson-01-api:
    build: ./Lesson 01/app/api
    volumes:
      - ./Lesson 01/app/config:/srv/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  lesson-02-api:
    build: ./Lesson 02/app/api
    volumes:
      - ./Lesson 02/app/config:/srv/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  lesson-03-api:
    build: ./Lesson 03/app/api
    volumes:
      - ./Lesson 03/app/config:/srv/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  lesson-04-api:
    build: ./Lesson 04/app/api
    volumes:
      - ./Lesson 04/app/config:/srv/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  lesson-05-api:
    build: ./Lesson 05/app/api
    volumes:
      - ./Lesson 05/app/config:/srv/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  lesson-06-api:
    build: ./Lesson 06/app/api
    volumes:
      - ./Lesson 06/app/config:/srv/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  lesson-07-api:
    build: ./Lesson 07/app/api
    volumes:
      - ./Lesson 07/app/config:/srv/config:ro
      # История диалогов сохраняется между перезапусками контейнера.
      - ./Lesson 07/app/data:/srv/data
    environment:
      CONTEXT_DB_PATH: /srv/data/context.db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  lesson-08-api:
    build: ./Lesson 08/app/api
    restart: unless-stopped

  lesson-09-api:
    build: ./Lesson 09/app/api
    volumes:
      - ./Lesson 06/app/config:/srv/config:ro
    restart: unless-stopped

  lesson-10-api:
    build: ./Lesson 10/app/api
    volumes:
      - ./Lesson 06/app/config:/srv/config:ro
    restart: unless-stopped

  lesson-11-api:
    build: ./Lesson 11/app/api
    volumes:
      - ./Lesson 06/app/config:/srv/config:ro
      # Долговременная память урока 11 сохраняется между перезапусками.
      - ./Lesson 11/app/data:/srv/data
    environment:
      MEMORY_DB_PATH: /srv/data/memory.db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  lesson-12-api:
    build: ./Lesson 12/app/api
    volumes:
      - ./Lesson 06/app/config:/srv/config:ro
      # Профиль и предпочтения урока 12 сохраняются между перезапусками.
      - ./Lesson 12/app/data:/srv/data
    environment:
      PROFILE_DB_PATH: /srv/data/profile.db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  lesson-13-api:
    build: ./Lesson 13/app/api
    volumes:
      - ./Lesson 06/app/config:/srv/config:ro
      # Состояние задачи сохраняется между перезапусками.
      - ./Lesson 13/app/data:/srv/data
    environment:
      TASK_DB_PATH: /srv/data/lesson13.db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  lesson-14-api:
    build: ./Lesson 14/app/api
    volumes:
      - ./Lesson 06/app/config:/srv/config:ro
      - ./Lesson 14/app/data:/srv/data
    environment:
      INVARIANT_DB_PATH: /srv/data/lesson14.db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  lesson-15-api:
    build: ./Lesson 15/app/api
    volumes:
      - ./Lesson 06/app/config:/srv/config:ro
      - ./Lesson 15/app/data:/srv/data
    environment:
      MEMORY_DB_PATH: /srv/data/lesson15.db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  lesson-16-api:
    build: ./Lesson 16/app/api
    volumes:
      - ./Lesson 16/app/config:/srv/config:ro
      - ./Lesson 16/app/data:/srv/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  lesson-17-api:
    build: ./Lesson 17/app/api
    volumes:
      - ./Lesson 17/app/config:/srv/config:ro
    restart: unless-stopped

  lesson-18-api:
    build: ./Lesson 18/app/api
    volumes:
      - ./Lesson 18/app/config:/srv/config:ro
      # Снимки и отчёты планировщика переживают перезапуск контейнера.
      - ./Lesson 18/app/data:/srv/data
    environment:
      SCHEDULER_DB_PATH: /srv/data/lesson18.db
    restart: unless-stopped

  lesson-19-api:
    build: ./Lesson 19/app/api
    volumes:
      - ./Lesson 19/app/data:/srv/data
    environment:
      PIPELINE_OUTPUT_DIR: /srv/data/output
    restart: unless-stopped

  gateway:
    build: ./gateway
    environment:
      LESSON_01_URL: http://lesson-01-api:8000
      LESSON_02_URL: http://lesson-02-api:8000
      LESSON_03_URL: http://lesson-03-api:8000
      LESSON_04_URL: http://lesson-04-api:8000
      LESSON_05_URL: http://lesson-05-api:8000
      LESSON_06_URL: http://lesson-06-api:8000
      LESSON_07_URL: http://lesson-07-api:8000
      LESSON_08_URL: http://lesson-08-api:8000
      LESSON_09_URL: http://lesson-09-api:8000
      LESSON_10_URL: http://lesson-10-api:8000
      LESSON_11_URL: http://lesson-11-api:8000
      LESSON_12_URL: http://lesson-12-api:8000
      LESSON_13_URL: http://lesson-13-api:8000
      LESSON_14_URL: http://lesson-14-api:8000
      LESSON_15_URL: http://lesson-15-api:8000
      LESSON_16_URL: http://lesson-16-api:8000
      LESSON_17_URL: http://lesson-17-api:8000
      LESSON_18_URL: http://lesson-18-api:8000
      LESSON_19_URL: http://lesson-19-api:8000
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      - lesson-01-api
      - lesson-02-api
      - lesson-03-api
      - lesson-04-api
      - lesson-05-api
      - lesson-06-api
      - lesson-07-api
      - lesson-08-api
      - lesson-09-api
      - lesson-10-api
      - lesson-11-api
      - lesson-12-api
      - lesson-13-api
      - lesson-14-api
      - lesson-15-api
      - lesson-16-api
      - lesson-17-api
      - lesson-18-api
      - lesson-19-api
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  front:
    build: ./shared_front
    environment:
      # Один адрес на все уроки — шлюз разводит их по префиксам.
      CHAT_API_BASE_URL: http://gateway:8000/lesson-01
      FORMAT_API_BASE_URL: http://gateway:8000/lesson-02
      REASONING_API_BASE_URL: http://gateway:8000/lesson-03
      TEMP_API_BASE_URL: http://gateway:8000/lesson-04
      MODEL_API_BASE_URL: http://gateway:8000/lesson-05
      AGENT_API_BASE_URL: http://gateway:8000/lesson-06
      CONTEXT_API_BASE_URL: http://gateway:8000/lesson-07
      TOKEN_API_BASE_URL: http://gateway:8000/lesson-08
      CONTROL_API_BASE_URL: http://gateway:8000/lesson-09
      LESSON_10_API_BASE_URL: http://gateway:8000/lesson-10
      LESSON_11_API_BASE_URL: http://gateway:8000/lesson-11
      LESSON_12_API_BASE_URL: http://gateway:8000/lesson-12
      LESSON_13_API_BASE_URL: http://gateway:8000/lesson-13
      LESSON_14_API_BASE_URL: http://gateway:8000/lesson-14
      LESSON_15_API_BASE_URL: http://gateway:8000/lesson-15
      LESSON_16_API_BASE_URL: http://gateway:8000/lesson-16
      LESSON_17_API_BASE_URL: http://gateway:8000/lesson-17
      LESSON_18_API_BASE_URL: http://gateway:8000/lesson-18
      LESSON_19_API_BASE_URL: http://gateway:8000/lesson-19
    ports:
      - "${FRONT_PORT:-8500}:8501"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
