name: models-lab

services:
  api:
    build: ./api
    # Конфигурация, прайс и токены приходят файлами при деплое.
    volumes:
      - ./config:/srv/config:ro
    extra_hosts:
      # позволяет указать в secrets.properties локальный/корпоративный endpoint
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8005}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  front:
    build: ./front
    environment:
      # API урока 05 — в этой же compose-сети; уроки 01–04 публикуются на хосте
      MODEL_API_BASE_URL: http://api:8000
      CHAT_API_BASE_URL: ${CHAT_API_BASE_URL:-http://host.docker.internal:8000}
      FORMAT_API_BASE_URL: ${FORMAT_API_BASE_URL:-http://host.docker.internal:8002}
      REASONING_API_BASE_URL: ${REASONING_API_BASE_URL:-http://host.docker.internal:8003}
      TEMP_API_BASE_URL: ${TEMP_API_BASE_URL:-http://host.docker.internal:8004}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${FRONT_PORT:-8505}:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
