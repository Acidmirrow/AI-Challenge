# ============================================================================
#  Конфигурация API урока 07. Лежит в git, секретов не содержит.
#  Ключи: deepseek.api.key == deepseek-api-key == DEEPSEEK_API_KEY
# ============================================================================

provider = deepseek

openai.base.url = https://api.openai.com/v1
deepseek.base.url = https://api.deepseek.com/v1

reasoning.param = reasoning_effort
max.tokens.param = max_tokens
include.usage = true
http.timeout.s = 180
models.json =
dynamic.models = false
cors.origins = *

# Прайс для оценки стоимости прогона ($ за 1 млн токенов)
pricing.file = /srv/config/pricing.properties

# Урок 07: SQLite-хранилище контекста
context.db.path = /srv/data/context.db
context.max.messages = 20
context.max.chars = 20000
