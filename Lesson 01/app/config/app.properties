# ============================================================================
#  Конфигурация API. Лежит в git. Секретов здесь быть не должно.
#  Ключи принимаются как deepseek.api.key, DEEPSEEK_API_KEY или deepseek-api-key.
#  Приоритет: env процесса > .env > docker secrets > этот файл > secrets.properties
# ============================================================================

# mock | openai | deepseek
provider = deepseek

openai.base.url = https://api.openai.com/v1
deepseek.base.url = https://api.deepseek.com/v1

# Токены НЕ здесь: см. secrets.properties (он в .gitignore и монтируется при деплое)

# Параметры провайдера
reasoning.param = reasoning_effort
max.tokens.param = max_tokens
include.usage = true
http.timeout.s = 180

# Каталог моделей: пусто = встроенный для выбранного provider
models.json =
dynamic.models = false

# --- Веб-поиск ---------------------------------------------------------------
# off | auto | duckduckgo | bing | brave-html | brave-api | tavily
web.search.backend = auto
web.search.results = 5
web.search.timeout.s = 12
web.search.pages = 2
web.search.page.chars = 3000

# Ключи поиска живут в secrets.properties
# tavily.api.key =
# brave.api.key =

cors.origins = *
